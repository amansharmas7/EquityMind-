[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equitymind-research-studio"
version = "0.2.0"
description = "Evidence-aware equity research, portfolio diagnostics, and valuation scenario analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Aman Sharma" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
agent = ["langgraph>=0.2,<2.0", "langchain-openai>=0.2,<2.0", "openai>=1.50,<3.0"]
database = ["psycopg[binary]>=3.2,<4.0", "pgvector>=0.3,<1.0"]
nlp = ["transformers>=4.44,<6.0", "torch>=2.4"]
local-embeddings = ["sentence-transformers>=3.0,<6.0"]
sec = ["beautifulsoup4>=4.12,<5.0"]
india-market = ["yfinance>=0.2.50,<2.0", "pypdf>=5.0,<7.0"]
dev = ["pytest>=8.3,<10.0", "pytest-cov>=5.0,<8.0", "ruff>=0.6,<1.0"]
all = [
  "langgraph>=0.2,<2.0", "langchain-openai>=0.2,<2.0", "openai>=1.50,<3.0",
  "psycopg[binary]>=3.2,<4.0", "pgvector>=0.3,<1.0",
  "sentence-transformers>=3.0,<6.0", "transformers>=4.44,<6.0", "torch>=2.4", "beautifulsoup4>=4.12,<5.0", "yfinance>=0.2.50,<2.0", "pypdf>=5.0,<7.0"
]

[tool.setuptools.packages.find]
include = ["equitymind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
